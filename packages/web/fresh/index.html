<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#2d0f5e" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="../icons/icon.svg" type="image/svg+xml" />
    <title>Neu starten · Wohin jetzt?</title>
    <style>
      :root {
        --ink: #1d1530;
        --muted: #5d5670;
        --accent: #5e1f8c;
        --danger: #c92a2a;
        --line-strong: #d6cfe0;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f0ecf4;
        color: var(--ink);
        font:
          16px/1.45 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        box-sizing: border-box;
        width: min(420px, 100% - 32px);
        margin: calc(env(safe-area-inset-top, 0px) + 16px) 0 16px;
        padding: 20px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 2px 10px rgba(20, 10, 40, 0.18);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 12px;
      }
      #personal {
        color: var(--muted);
      }
      .buttons {
        display: grid;
        gap: 8px;
        margin-top: 16px;
      }
      button,
      a {
        box-sizing: border-box;
        min-height: 44px;
        padding: 10px 14px;
        border-radius: 999px;
        font: inherit;
        font-weight: 600;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }
      #keep {
        border: 0;
        background: var(--accent);
        color: #fff;
      }
      #all {
        border: 1px solid var(--danger);
        background: #fff;
        color: var(--danger);
      }
      #cancel {
        border: 1px solid var(--line-strong);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <main id="fresh">
      <h1 id="title">Neu starten</h1>
      <p id="intro"></p>
      <p id="working">Wird neu gestartet …</p>
      <div id="choice" hidden>
        <p id="personal"></p>
        <div class="buttons">
          <button id="keep" type="button"></button>
          <button id="all" type="button"></button>
          <a id="cancel" href="../"></a>
        </div>
      </div>
    </main>
    <!-- fresh.ts -->
  </body>
</html>
