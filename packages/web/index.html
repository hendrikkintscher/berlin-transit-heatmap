<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2d0f5e" />
    <meta
      name="description"
      content="Wie lange brauchst du mit Bus und Bahn von einem Punkt in Berlin überallhin?"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Berlin Transit" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Berlin in Minuten</title>
  </head>
  <body>
    <div id="map" aria-label="Karte von Berlin" data-t-label="mapLabel"></div>
    <div id="loadbar" hidden><div></div></div>

    <header class="top">
      <div class="seg" role="radiogroup" aria-label="Zeitfenster" data-t-label="timeWindow">
        <button role="radio" data-window="day" aria-checked="true">
          <span data-t="day">Tag</span> <small>10–12</small>
        </button>
        <button role="radio" data-window="night" aria-checked="false">
          <span data-t="night">Nacht</span> <small>2–4</small>
        </button>
      </div>
      <button
        id="search-btn"
        class="round"
        type="button"
        aria-label="Adresse suchen"
        data-t-label="searchOpen"
      >
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <circle
            cx="10.5"
            cy="10.5"
            r="6.5"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
          />
          <path
            d="M15.5 15.5 21 21"
            stroke="currentColor"
            stroke-width="2.6"
            stroke-linecap="round"
          />
        </svg>
      </button>
      <button
        id="menu-btn"
        class="round"
        type="button"
        aria-label="Menü"
        data-t-label="menuOpen"
        aria-haspopup="dialog"
        aria-controls="menu"
      >
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path
            d="M4 7h16M4 12h16M4 17h16"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </header>

    <div id="search" class="search" role="search" hidden>
      <div class="search-box">
        <input
          id="search-input"
          type="search"
          enterkeyhint="search"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Straße, Ort oder Haltestelle"
          data-t-placeholder="searchPlaceholder"
          aria-label="Adresse"
          data-t-label="searchField"
          role="combobox"
          aria-autocomplete="list"
          aria-controls="search-results"
          aria-expanded="false"
        />
        <button
          id="search-close"
          type="button"
          aria-label="Suche schließen"
          data-t-label="searchClose"
        >
          ✕
        </button>
      </div>
      <ul id="search-results" class="search-results" role="listbox" hidden></ul>
      <div id="search-msg" class="search-msg" hidden></div>
    </div>

    <div id="hint" class="chip" data-t="hint">Tippe auf die Karte oder suche einen Startpunkt</div>

    <footer class="bottom">
      <div id="readout" class="chip" hidden>
        <span id="readout-text"></span>
        <button id="readout-start" type="button" data-t="startHere">Hier starten</button>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
      <div class="legend" aria-label="Legende Reisezeit in Minuten" data-t-label="legend">
        <div id="legend-bar"></div>
        <div id="legend-ticks" class="legend-ticks"></div>
      </div>
    </footer>

    <dialog id="menu" class="menu" aria-labelledby="menu-title">
      <div class="menu-head">
        <h2 id="menu-title" data-t="title">Berlin in Minuten</h2>
        <button
          id="menu-close"
          class="menu-x"
          type="button"
          aria-label="Menü schließen"
          data-t-label="menuClose"
        >
          ✕
        </button>
      </div>

      <h3 data-t="menuMap">Karte</h3>
      <label class="toggle">
        <span class="toggle-text">
          <b data-t="lines">Linien</b>
          <small data-t="linesHint"
            >Die Verbindungen, über die du von deinem Start am schnellsten fährst</small
          >
        </span>
        <input id="routes-toggle" type="checkbox" role="switch" checked />
      </label>

      <h3 data-t="menuLanguage">Sprache</h3>
      <div class="seg seg-wide" role="radiogroup" aria-label="Sprache" data-t-label="menuLanguage">
        <button role="radio" data-lang="de" aria-checked="true" lang="de">Deutsch</button>
        <button role="radio" data-lang="en" aria-checked="false" lang="en">English</button>
      </div>

      <button id="about-btn" class="menu-link" type="button" data-t="about">
        Über diese Karte
      </button>
    </dialog>

    <dialog id="info">
      <h2 data-t="title">Berlin in Minuten</h2>
      <p data-t-html="aboutHow"></p>
      <p data-t-html="aboutLines"></p>
      <p data-t-html="aboutWindows"></p>
      <p data-t="aboutArea"></p>
      <p id="feed-info"></p>
      <p class="small" data-t-html="credits"></p>
      <form method="dialog"><button data-t="close">Schließen</button></form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
