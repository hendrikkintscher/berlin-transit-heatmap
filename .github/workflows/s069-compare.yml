# TEMPORARY (S069): old vs new merge on the same real extracts; publishes nothing. Removed before merge.
name: S069 compare
on:
  push:
    branches: [ccr-f50ddbf6-cmt1zq]
    paths: [.github/workflows/s069-compare.yml, scripts/osm/**]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: |
          echo "BBOX=$(node scripts/region.mjs osmBbox)" >> "$GITHUB_ENV"
          echo "EXTRACTS=$(node scripts/region.mjs osmExtracts)" >> "$GITHUB_ENV"
      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: New script (download + merge)
        run: bash scripts/osm/extracts.sh work $EXTRACTS
      - name: Old merge on the same files
        run: |
          cd work
          read -ra extracts <<<"$EXTRACTS"
          osmium merge "${extracts[@]/%/.osm.pbf}" -o old-merged.osm.pbf
          osmium fileinfo -e old-merged.osm.pbf | grep -E 'Number of|Objects ordered|Multiple versions'
          osmium fileinfo -e merged.osm.pbf | grep -E 'Number of|Objects ordered|Multiple versions'
      - name: Both pipelines
        run: |
          cd work
          for v in old new; do
            m=merged.osm.pbf; [ "$v" = old ] && m=old-merged.osm.pbf
            mkdir -p "$v"
            if osmium extract -b "$BBOX" "$m" -o "$v/area.osm.pbf" \
              && osmium tags-filter "$v/area.osm.pbf" nwr/amenity=atm nwr/atm=yes -o "$v/atms.osm.pbf" \
              && osmium export -f geojsonseq -a type,id "$v/atms.osm.pbf" -o "$v/atms.geojsonseq" \
              && node ../scripts/addons/atms.mjs "$v/atms.geojsonseq" "$v/atm.json" \
              && osmium extract -b "$BBOX" --strategy complete_ways "$m" -o "$v/warea.osm.pbf" \
              && osmium tags-filter -t "$v/warea.osm.pbf" w/highway w/railway=platform w/public_transport=platform -o "$v/walkways.osm.pbf" \
              && osmium cat -f opl,add_metadata=false "$v/walkways.osm.pbf" | gzip -9n > "$v/walkways.opl.gz"; then
              echo "$v: ok"; ls -la "$v"/atm.json "$v"/walkways.opl.gz
            else
              echo "$v: FAILED"
            fi
          done
          if [ -f old/atm.json ]; then
            cmp old/atm.json new/atm.json && echo "atm.json identical"
            cmp old/walkways.opl.gz new/walkways.opl.gz && echo "walkways.opl.gz identical"
          fi
          sha256sum new/atm.json new/walkways.opl.gz
