name: Build timetable

# Turns the latest VBB GTFS feed (release `gtfs-latest`) into the compact
# per-window timetable files the web app downloads, and publishes them on the
# release `timetable-latest`. Runs every night after the feed check, so the
# files for today and the next seven days (DAYS) move on with the calendar.

on:
  workflow_run:
    workflows: ['Refresh VBB GTFS', 'Refresh OSM footpaths']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to publish on (another tag for a trial run)
        default: timetable-latest
      swap_above:
        description: Calls above which a fresh release replaces the old one (0 forces it)
        default: '300'

permissions:
  contents: write

concurrency:
  group: build-timetable
  cancel-in-progress: false

env:
  GTFS_TAG: gtfs-latest
  OSM_TAG: osm-latest
  TIMETABLE_TAG: ${{ inputs.tag || 'timetable-latest' }}
  # Budget from the alpha plan, per timetable file.
  MAX_BYTES: 8000000
  MAX_GZIP_BYTES: 2000000
  # Real dates with their own hourly files: today and the next seven days.
  DAYS: 8

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Download GTFS feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          scripts/publish/download.sh "$GTFS_TAG" work GTFS.zip manifest.json
          cat work/manifest.json

      - name: Download OSM footpaths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Optional: without it the build falls back to straight-line walking.
          scripts/publish/download.sh "$OSM_TAG" work walkways.opl.gz || echo "::warning::No $OSM_TAG release; building without the walking network."

      - name: Build timetable files
        run: |
          osm=""
          if [ -f work/walkways.opl.gz ]; then osm="--osm work/walkways.opl.gz"; fi
          NODE_OPTIONS=--max-old-space-size=6144 pnpm build-timetable --gtfs work/GTFS.zip --out work/out --days "$DAYS" $osm
          # Record which feed the files were built from.
          jq --slurpfile gtfs work/manifest.json '. + {gtfs: $gtfs[0]}' work/out/build-info.json > work/build-info.json
          mv work/build-info.json work/out/build-info.json
          cat work/out/build-info.json

      - name: Check size budget
        run: |
          for path in work/out/timetable-*.json work/out/timetable-*.bin; do
            f=$(basename "$path")
            bytes=$(jq ".files[\"$f\"].bytes" work/out/build-info.json)
            gz=$(jq ".files[\"$f\"].gzipBytes" work/out/build-info.json)
            echo "$f: $bytes bytes, $gz gzipped"
            if [ "$bytes" -gt "$MAX_BYTES" ] || [ "$gz" -gt "$MAX_GZIP_BYTES" ]; then
              echo "::warning title=Timetable over budget::$f is $bytes bytes ($gz gzipped), budget $MAX_BYTES ($MAX_GZIP_BYTES gzipped)"
            fi
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          service=$(jq -r .serviceDate work/out/build-info.json)
          feed=$(jq -r '.gtfs.serviceStart + " to " + .gtfs.serviceEnd' work/out/build-info.json)
          dates=$(jq -r '.stats.dates | if length > 0 then "\(.[0]) to \(.[-1])" else "none" end' work/out/build-info.json)
          notes="Timetable files for the web app, built $(date -u +%Y-%m-%d) from VBB GTFS ($feed). Reference service day: $service. Real dates: $dates. Data © VBB, CC BY 4.0."
          # Only new and changed files go up, never leaving one missing (scripts/publish).
          keep=""
          if [ ! -f work/out/walk.bin ]; then keep="--keep walk.bin"; fi
          node scripts/publish/publish.mjs --dir work/out --tag "$TIMETABLE_TAG" --notes "$notes" --swap-above "${{ inputs.swap_above || '300' }}" $keep
