name: Build timetable

# Turns the latest VBB GTFS feed (release `gtfs-latest`) into the compact
# per-window timetable files the web app downloads, and publishes them on the
# release `timetable-latest`. Runs every night after the feed check, so the
# files for today and the next seven days (DAYS) move on with the calendar. It also
# has a schedule of its own: when the feed check failed (or never ran), the dates
# still move on, built from the last good feed on `gtfs-latest`.

on:
  workflow_run:
    workflows: ['Refresh VBB GTFS', 'Refresh OSM footpaths']
    types: [completed]
  # 03:37 or 04:37 in Berlin, well after the feed check at 00:17 UTC. Builds only when
  # the published timetable does not start today yet (see the guard job).
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Release to publish on (another tag for a trial run)
        default: timetable-latest
      swap_above:
        description: Calls above which a fresh release replaces the old one (0 forces it)
        default: '300'

permissions:
  contents: read
  actions: read

concurrency:
  group: build-timetable
  cancel-in-progress: false

env:
  GTFS_TAG: gtfs-latest
  OSM_TAG: osm-latest
  TIMETABLE_TAG: ${{ inputs.tag || 'timetable-latest' }}
  # Budget from the alpha plan, per timetable file: above it the build warns; above
  # one and a half times it (CEILING_PERCENT) it fails and nothing is published.
  MAX_BYTES: 8000000
  MAX_GZIP_BYTES: 2000000
  CEILING_PERCENT: 150
  # Real dates with their own hourly files: today and the next seven days.
  DAYS: 8

# Steps run as bash -eo pipefail: a failing command in a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # The scheduled run builds only when the nightly one did not: the published files do
  # not start today in Berlin, and no feed check or build runs or started within the
  # last hour (the publish's API budget).
  guard:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          today=$(TZ=Europe/Berlin date +%F)
          first=$(curl -fsSL --retry 3 \
            "https://github.com/$REPO/releases/download/$TIMETABLE_TAG/build-info.json" \
            | jq -r '.serviceDate // empty' || true)
          echo "The published timetable starts on '$first'; in Berlin it is $today."
          if [[ -n "$first" && ! "$first" < "$today" ]]; then
            echo "Up to date, nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          since=$(date -u -d '-60 min' +%FT%TZ)
          busy=$(gh api -X GET "repos/$REPO/actions/runs" -f per_page=50 --jq "
            [.workflow_runs[]
              | select(.id != ${{ github.run_id }})
              | select(.name == \"Refresh VBB GTFS\" or .name == \"Build timetable\")
              | select(.status != \"completed\" or .created_at > \"$since\")]
            | length")
          if (( busy > 0 )); then
            echo "A feed check or build is running or started within the last hour."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'schedule' && needs.guard.outputs.build == 'true') ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Publishing the release is the only write in this workflow.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Download GTFS feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          scripts/publish/download.sh "$GTFS_TAG" work GTFS.zip manifest.json
          cat work/manifest.json

      - name: Download OSM footpaths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Optional: without it the build falls back to straight-line walking.
          scripts/publish/download.sh "$OSM_TAG" work walkways.opl.gz || echo "::warning::No $OSM_TAG release; building without the walking network."

      - name: Build timetable files
        run: |
          osm=()
          if [ -f work/walkways.opl.gz ]; then osm=(--osm work/walkways.opl.gz); fi
          NODE_OPTIONS=--max-old-space-size=6144 pnpm build-timetable --gtfs work/GTFS.zip --out work/out --days "$DAYS" "${osm[@]}"
          # Record which feed the files were built from.
          jq --slurpfile gtfs work/manifest.json '. + {gtfs: $gtfs[0]}' work/out/build-info.json > work/build-info.json
          mv work/build-info.json work/out/build-info.json
          cat work/out/build-info.json

      - name: Check size budget
        run: |
          ceil_bytes=$((MAX_BYTES * CEILING_PERCENT / 100))
          ceil_gz=$((MAX_GZIP_BYTES * CEILING_PERCENT / 100))
          over=0
          for path in work/out/timetable-*.bin; do
            f=$(basename "$path")
            bytes=$(jq ".files[\"$f\"].bytes" work/out/build-info.json)
            gz=$(jq ".files[\"$f\"].gzipBytes" work/out/build-info.json)
            echo "$f: $bytes bytes, $gz gzipped"
            if [ "$bytes" -gt "$ceil_bytes" ] || [ "$gz" -gt "$ceil_gz" ]; then
              echo "::error title=Timetable over its ceiling::$f is $bytes bytes ($gz gzipped), ceiling $ceil_bytes ($ceil_gz gzipped)"
              over=1
            elif [ "$bytes" -gt "$MAX_BYTES" ] || [ "$gz" -gt "$MAX_GZIP_BYTES" ]; then
              echo "::warning title=Timetable over budget::$f is $bytes bytes ($gz gzipped), budget $MAX_BYTES ($MAX_GZIP_BYTES gzipped)"
            fi
          done
          # Phones would download far too much: keep the files already published.
          if [ "$over" = 1 ]; then exit 1; fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SWAP_ABOVE: ${{ inputs.swap_above || '300' }}
        run: |
          service=$(jq -r .serviceDate work/out/build-info.json)
          feed=$(jq -r '.gtfs.serviceStart + " to " + .gtfs.serviceEnd' work/out/build-info.json)
          dates=$(jq -r '.stats.dates | if length > 0 then "\(.[0]) to \(.[-1])" else "none" end' work/out/build-info.json)
          notes="Timetable files for the web app, built $(date -u +%Y-%m-%d) from VBB GTFS ($feed). Reference service day: $service. Real dates: $dates. Data © VBB, CC BY 4.0."
          # Only new and changed files go up, never leaving one missing (scripts/publish).
          keep=()
          if [ ! -f work/out/walk.bin ]; then keep=(--keep walk.bin --keep streets.json); fi
          node scripts/publish/publish.mjs --dir work/out --tag "$TIMETABLE_TAG" --notes "$notes" --swap-above "$SWAP_ABOVE" "${keep[@]}"
