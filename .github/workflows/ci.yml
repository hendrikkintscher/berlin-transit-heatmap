name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  # Speed budget (roadmap B1): the app may not get bigger or slower than allowed.
  # See scripts/speed/check.mjs; the job summary shows the numbers.
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/web build
      - name: Download real timetable and footpaths
        run: scripts/publish/download.sh timetable-latest work/speed timetable-weekday-10.bin walk.bin
      - name: Check out main to compare against
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          git worktree add work/base FETCH_HEAD
      - name: Check speed budget
        run: node scripts/speed/check.mjs --data work/speed ${{ github.event_name == 'pull_request' && '--base work/base' || '' }}
