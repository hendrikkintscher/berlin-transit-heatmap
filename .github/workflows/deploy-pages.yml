name: Deploy web app to Pages

on:
  push:
    branches: [main]
    # Roadmap, README and other notes change nothing on the site.
    paths-ignore: ['**.md']
  workflow_dispatch:
  # Redeploy when a new timetable has been published.
  workflow_run:
    workflows: ['Build timetable']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Pull requests are tested by CI (ci.yml); this only deploys.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          if [ -f pnpm-workspace.yaml ]; then
            pnpm install --frozen-lockfile
          else
            # Until the workspace root exists, install the web package on its own.
            pnpm --dir packages/web install --ignore-workspace --no-frozen-lockfile
          fi

      - name: Test
        run: pnpm --dir packages/web test

      - name: Build
        run: pnpm --dir packages/web build

      - name: Smoke test
        run: node scripts/smoke/smoke.mjs

      - name: Add latest timetable
        env:
          GH_TOKEN: ${{ github.token }}
          # Only what the app loads (the release also keeps stops.json and checksums.json).
          DOWNLOAD_ONLY: '^(timetable-.*\.bin|walk\.bin|lines\.bin|streets\.json|changes\.json|stop-ids\.json|build-info\.json)$'
        run: |
          # Each region's data in its own folder (data/<id>/, see packages/web/src/region.ts).
          dir="packages/web/dist/data/$(node scripts/region.mjs id)"
          mkdir -p "$dir"
          if scripts/publish/download.sh timetable-latest "$dir"; then
            ls -la "$dir"
            # The files' versions go into the start page: phones keep each file until it changes.
            node scripts/publish/data-versions.mjs "$dir" packages/web/dist/index.html
          else
            echo "::warning::No timetable-latest release yet; the app will run on demo data."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
