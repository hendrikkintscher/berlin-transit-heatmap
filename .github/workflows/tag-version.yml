name: Tag version

# Every step ships a new app version in packages/web/package.json (the one the Mehr menu
# shows). When a merge to main changes that file, this tags the merge commit `vX.Y.Z`,
# unless the tag already exists. Its own job, so the deploy is not slowed. Tags made with
# GITHUB_TOKEN start no other workflow, and `v*` never clashes with the data releases
# (timetable-*, gtfs-*, osm-*).

on:
  push:
    branches: [main]
    paths: ['packages/web/package.json']
  # Catch up by hand: tags the current main if its version has no tag yet.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-version
  cancel-in-progress: false

# Steps run as bash -eo pipefail: a failing command in a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Tag the version if new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/web/package.json').version")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag exists already, nothing to do."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          echo "Tagged $GITHUB_SHA as $tag."
          echo "Tagged \`$tag\` on ${GITHUB_SHA::7}." >> "$GITHUB_STEP_SUMMARY"
